name: 💡 Feature idea
description: Suggest something new or a way to make GM Sentinel better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like GM Sentinel to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The problem it solves or the situation where you would use it.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Sketch or screenshot (optional)
